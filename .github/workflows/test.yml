name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate sample DB
        run: go run scripts/gen_sample_db.go
      - name: Verify sample DB is reproducible
        run: git diff --exit-code -- testdata/sample.sqlite
      - name: Go tests
        run: go test ./... -race -count=1
      - name: Go vet
        run: go vet ./...
      - name: Go vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend tests
        working-directory: frontend
        run: npm test -- --run
      - name: Frontend production build
        working-directory: frontend
        run: npm run build
      - name: Frontend vulnerability audit
        working-directory: frontend
        run: npm audit --audit-level=low

  packages:
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux/amd64
          - os: macos-15
            platform: darwin/universal
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
      - name: Build package
        run: wails build -clean -trimpath -m -platform "${{ matrix.platform }}"
      - name: Validate Linux binary
        if: runner.os == 'Linux'
        run: test -x build/bin/sqlite-explorer && file build/bin/sqlite-explorer
      - name: Validate macOS bundle
        if: runner.os == 'macOS'
        run: |
          test -x build/bin/sqlite-explorer.app/Contents/MacOS/sqlite-explorer
          plutil -lint build/bin/sqlite-explorer.app/Contents/Info.plist
